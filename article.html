<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#f7f5f0;font-family:Arial}.wrap{max-width:850px;margin:30px auto;padding:20px}article{background:#fff;padding:25px}h1{font:48px Georgia}img{max-width:100%;max-height:550px;object-fit:cover}p{line-height:1.7}@media(max-width:600px){h1{font-size:35px}}</style><main class=wrap><a href="/">← Kyoga Pen</a><div id=s></div></main><script>let e=x=>String(x||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));fetch("/api/articles/"+new URLSearchParams(location.search).get("id")).then(r=>r.json()).then(x=>s.innerHTML=`<article><b>${e(x.category)}</b><h1>${e(x.title)}</h1><p>By ${e(x.author)} · ${new Date(x.published_at||x.created_at).toLocaleString()}</p><img src="${e(x.image||"https://picsum.photos/900/600?random="+x.id)}"><p>${e(x.content).replace(/\\n/g,"</p><p>")}</p></article>`)</script>
