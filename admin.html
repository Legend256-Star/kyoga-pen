<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kyoga Admin</title><style>body{margin:0;background:#f2f2f2;font-family:Arial}.box{max-width:900px;margin:20px auto;background:white;padding:22px;border-radius:12px}input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;box-sizing:border-box}textarea{min-height:220px}button{padding:11px 16px;background:#a52b22;color:#fff;border:0;border-radius:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.story{padding:14px 0;border-top:1px solid #ddd}@media(max-width:600px){.row{grid-template-columns:1fr}}</style><div class=box><h1>Kyoga 🖋️ Pen Admin</h1><section id=login><input id=u placeholder=Username><input id=p type=password placeholder=Password><button onclick=login()>Login</button><p id=m></p></section><section id=d style=display:none><button onclick=logout()>Logout</button><h2>Write a Story</h2><input id=id type=hidden><input id=t placeholder="Headline"><div class=row><select id=c><option>World</option><option>Uganda</option><option>Business</option><option>Technology</option><option>Sports</option><option>Opinion</option></select><input id=a value="Kyoga Pen" placeholder=Author></div><textarea id=e placeholder="Short excerpt"></textarea><textarea id=ct placeholder="Write the full story here..."></textarea><input id=im type=file accept=image/*><label><input id=f type=checkbox style="width:auto"> Featured story</label><p><button onclick=save("published")>Publish</button> <button onclick=save("draft")>Save Draft</button> <button onclick=clearForm()>Clear</button></p><h2>Stories</h2><div id=list></div></section></div><script>
const $=x=>document.querySelector(x);async function me(){let x=await(await fetch("/api/me")).json();loginBox(x.loggedIn)}function loginBox(ok){login.style.display=ok?"none":"block";d.style.display=ok?"block":"none";if(ok)load()}async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});let x=await r.json();if(!r.ok)return m.textContent=x.error;me()}async function logout(){await fetch("/api/logout",{method:"POST"});me()}async function save(status){let image="";if(im.files[0]){let f=new FormData;f.append("image",im.files[0]);let r=await fetch("/api/upload",{method:"POST",body:f}),x=await r.json();if(!r.ok)return alert(x.error);image=x.url}else if(id.dataset.image)image=id.dataset.image;let body={title:t.value,category:c.value,excerpt:e.value,content:ct.value,author:a.value,image,featured:f.checked,status};if(!t.value||!ct.value)return alert("Headline and story are required");let rid=id.value;let r=await fetch(rid?"/api/articles/"+rid:"/api/articles",{method:rid?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});let x=await r.json();if(!r.ok)return alert(x.error);alert(status==="published"?"Published!":"Draft saved.");clearForm();load()}async function load(){let x=await(await fetch("/api/articles?status=all")).json();list.innerHTML=x.map(s=>`<div class=story><b>${s.title}</b> — ${s.status}<br><button onclick='edit(${JSON.stringify(s)})'>Edit</button> <button onclick='del(${s.id})'>Delete</button></div>`).join("")||"No stories yet."}function edit(s){id.value=s.id;id.dataset.image=s.image||"";t.value=s.title;c.value=s.category;e.value=s.excerpt;ct.value=s.content;a.value=s.author;f.checked=!!s.featured;scrollTo(0,0)}async function del(x){if(confirm("Delete?")){await fetch("/api/articles/"+x,{method:"DELETE"});load()}}function clearForm(){id.value="";id.dataset.image="";t.value=e.value=ct.value="";a.value="Kyoga Pen";f.checked=false;im.value=""}me();
</script>
