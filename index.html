<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kyoga 🖋️ Pen</title><style>
body{margin:0;background:#f7f5f0;color:#171717;font-family:Arial}.top{background:#111;color:#fff;padding:18px 5%}.top b{font:700 28px Georgia}.top small{display:block;color:#ccc}.nav{margin-top:12px;display:flex;gap:15px;flex-wrap:wrap}.nav a{color:white;text-decoration:none}.wrap{max-width:1150px;margin:25px auto;padding:0 16px}.hero{background:white;padding:20px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px}.hero img,.card img{width:100%;object-fit:cover}.hero img{height:330px}.hero h1,.card h2{font-family:Georgia}.hero h1{font-size:42px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px}.card{background:white;padding-bottom:15px}.card img{height:180px}.card div{padding:0 15px}.cat{color:#a52b22;font-weight:bold;text-transform:uppercase;font-size:12px}.muted{color:#777}.admin{position:fixed;right:15px;bottom:15px;background:#a52b22;color:white;padding:12px 18px;border-radius:30px;text-decoration:none}@media(max-width:700px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:32px}}@media(max-width:500px){.grid{grid-template-columns:1fr}}</style>
<header class="top"><b>Kyoga 🖋️ Pen</b><small>Your daily digital talking pen.</small><nav class="nav"><a href="/">Home</a><a href="?category=World">World</a><a href="?category=Business">Business</a><a href="?category=Technology">Technology</a><a href="?category=Sports">Sports</a><a href="?category=Opinion">Opinion</a><input id="q" placeholder="Search…"></nav></header><main class="wrap"><div id="hero"></div><div id="grid" class="grid"></div></main><a class="admin" href="/admin.html">Admin</a>
<script>const E=x=>String(x||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));async function load(){let p=new URLSearchParams(location.search),u="/api/articles?status=published&category="+encodeURIComponent(p.get("category")||"")+"&q="+encodeURIComponent(document.querySelector("#q").value);let a=await(await fetch(u)).json();if(!a.length)return hero.innerHTML="<p>No stories found.</p>";let h=a.find(x=>x.featured)||a[0];hero.innerHTML=`<section class=hero><img src="${E(h.image||"https://picsum.photos/900/600?random=1")}"><div><div class=cat>${E(h.category)}</div><h1>${E(h.title)}</h1><p class=muted>By ${E(h.author)} · ${new Date(h.published_at||h.created_at).toLocaleDateString()}</p><p>${E(h.excerpt)}</p><a href="/article.html?id=${h.id}">Read full story →</a></div></section>`;grid.innerHTML=a.filter(x=>x.id!==h.id).map(x=>`<article class=card><img src="${E(x.image||"https://picsum.photos/700/450?random="+x.id)}"><div><p class=cat>${E(x.category)}</p><h2>${E(x.title)}</h2><p>${E(x.excerpt)}</p><p class=muted>${E(x.author)}</p><a href="/article.html?id=${x.id}">Read →</a></div></article>`).join("")}q.oninput=load;load();</script></html>
